name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_submission.py . --online
      - name: Match tag to project version
        shell: pwsh
        run: |
          $version = python -c "from skillport import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match project version' }
      - run: python tools/build_release.py --repository "${{ github.repository }}" --commit "${{ github.sha }}"
      - name: Standalone executable smoke test
        run: python tools/smoke_release.py dist --output dist/portable-smoke.json
      - name: Publish reviewed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem dist -File | ForEach-Object FullName) --verify-tag --title "SkillPort $env:GITHUB_REF_NAME" --notes-file dist/START-HERE.md
